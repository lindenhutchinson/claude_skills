# Tooling for the repo's own Python: the installer, the hook guards and their tests. Nothing here is packaged.
[project]
name = "claude-skills"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/linden/hooks", "scripts"]
